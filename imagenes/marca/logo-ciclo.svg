<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="t">
  <title id="t">Soporte TI · Ciclo colaborativo</title>
  <!-- Versión principal para fondos oscuros (grafito). -->
  <defs>
    <linearGradient id="a" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5FD3E0"/>
